tags:
  - Contacts
summary: Update contact information
operationId: patchContact
description: 'Updates specified fields of a contact by their ID. Requires a valid bearer token.'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '60f7f3e2d6d3f712c8b5b2e1'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'John Doe'
          phoneNumber:
            type: string
            example: '+1 780 970 9977'
          email:
            type: string
            example: 'johndoe@gmail.com'
          contactType:
            type: string
            enum: [personal, home, work]
            example: personal
          isFavourite:
            type: boolean
            example: true
          photo:
            type: string
            format: binary
            description: "The contact's photo file"
responses:
  '200':
    description: 'Contact successfully updated'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated contact with id 60f7f3e2d6d3f712c8b5b2e1!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
