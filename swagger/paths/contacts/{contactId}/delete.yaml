tags:
  - Contacts
summary: Delete contact
operationId: deleteContact
description: 'Deletes a contact by its ID. Requires a valid bearer token.'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '60f7f3e2d6d3f712c8b5b2e1'
responses:
  '204':
    description: 'Contact successfully deleted'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
