tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: 'Retrieves a list of all contacts associated with the authenticated user. Requires a valid bearer token. Useful for displaying or managing contact lists.'
security:
  - bearerAuth: []
responses:
  '200':
    description: 'Get all contacts'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: array
              items:
                $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
