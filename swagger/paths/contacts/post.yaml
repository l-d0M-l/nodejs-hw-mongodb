tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: 'Creates a new contact for the authenticated user. Requires a valid bearer token.'
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
        properties:
          name:
            type: string
            example: 'John Doe'

          phoneNumber:
            type: string
            example: '+1 780 970 9977'

          email:
            type: string
            format: email
            example: 'johndoe@gmail.com'

          contactType:
            type: string
            enum: [personal, home, work]
            example: personal
            description: Type of contact

          isFavourite:
            type: boolean
            example: true
            description: Whether the contact is marked as favourite

          photo:
            type: string
            format: binary
            description: Contact photo file (image)
responses:
  '201':
    description: 'Create a contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
